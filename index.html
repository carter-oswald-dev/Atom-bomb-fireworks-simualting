<script>
// ===== Shared physics: magnitude light curve =====
// Model: first-principles thermal pulse, calibrated against a known reference
// point (500kt @ 200,000km => peak mag -12.30) so the yield/distance scaling
// behaves physically (accounting for pulse-duration stretching with yield)
// rather than a naive inverse-square/linear-yield ratio.
const NAKED_EYE_LIMIT = 6.0;
const PRE_DELAY = 5.0;
const RISE_TIME = 0.1;

// User-adjustable inputs (kt, km). Defaults reproduce the original scenario.
let YIELD_KT = 500;
let DISTANCE_KM = 200000;
const MAX_YIELD_KT = 100000; // 100 Mt — largest weapon class ever designed (Tsar Bomba)

// Reference/calibration point from the original simulation
const REF_YIELD_KT = 500;
const REF_DIST_KM = 200000;
const REF_PEAK_MAG = -12.30;

// Fraction of total yield energy actually emitted as visible-band light
// (as opposed to the full thermal pulse spectrum, dominated by UV/IR).
const VISIBLE_LIGHT_FRACTION = 0.005; // 0.5%

// Fixed physical decay: half the visible-light energy output is emitted within
// 300ms of peak, regardless of yield. This anchors the fade-off in a real
// measured-style time constant instead of a yield-dependent pulse-duration
// heuristic. Exponential decay: flux(t) = flux_peak * exp(-t/TAU_DECAY),
// where half-life T_HALF = TAU_DECAY * ln(2)  =>  TAU_DECAY = T_HALF / ln(2).
const T_HALF = 0.300; // seconds
const TAU_DECAY = T_HALF / Math.LN2;

let PEAK_MAG = REF_PEAK_MAG;
let TAU = TAU_DECAY;
let TOTAL_DURATION = 30.0 + PRE_DELAY;

function computeScenario(yieldKt, distanceKm) {
  // Peak visible flux scales with (yield x visible fraction) / distance^2.
  // VISIBLE_LIGHT_FRACTION is constant across yields, so it cancels in this
  // ratio against the reference point exactly as it would in the peak-mag
  // formula alone — it does not change peakMag here, but is kept explicit
  // since it's the physically meaningful quantity the ratio represents.
  const yieldRatio = yieldKt / REF_YIELD_KT;
  const distRatio = distanceKm / REF_DIST_KM;
  const fluxRatio = yieldRatio / (distRatio * distRatio);

  const peakMag = REF_PEAK_MAG - 2.5 * Math.log10(fluxRatio);

  // Decay time constant is now fixed (not yield-dependent) — the 300ms
  // half-life is treated as an intrinsic property of the visible-light
  // emission falloff, per the calibration this scenario uses.
  return { peakMag, tau: TAU_DECAY };
}

function applyScenario(yieldKt, distanceKm) {
  YIELD_KT = yieldKt;
  DISTANCE_KM = distanceKm;
  const { peakMag, tau } = computeScenario(yieldKt, distanceKm);
  PEAK_MAG = peakMag;
  TAU = tau;

  // Solve directly for when the exponential decay crosses magnitude 6.0
  // (naked-eye limit), then add a fixed tail so the fade is visible on screen.
  let timeToMag6;
  if (PEAK_MAG >= NAKED_EYE_LIMIT) {
    timeToMag6 = RISE_TIME;
  } else {
    timeToMag6 = RISE_TIME + TAU * (NAKED_EYE_LIMIT - PEAK_MAG) * Math.LN10 / 2.5;
  }
  const postDetDuration = timeToMag6 + 5.0; // 5s tail after crossing mag 6.00
  TOTAL_DURATION = postDetDuration + PRE_DELAY;
}

function magnitudeAtTime(tRaw) {
  const t = tRaw - PRE_DELAY;
  if (t <= 0) return NAKED_EYE_LIMIT + 2;
  if (t < RISE_TIME) {
    const frac = Math.max(t / RISE_TIME, 0.001);
    return PEAK_MAG + 2.5 * Math.log10(1/frac);
  }
  const fluxRatio = Math.exp(-(t - RISE_TIME) / TAU);
  return PEAK_MAG - 2.5 * Math.log10(fluxRatio);
}

function magToVisual(mag) {
  const visibility = Math.max(0, (NAKED_EYE_LIMIT - mag) / (NAKED_EYE_LIMIT - PEAK_MAG));
  return visibility;
}

// ===== Human eye persistence-of-vision filter =====
// Physically-accurate flash timing (magnitudeAtTime) is separate from what a
// person actually perceives: the eye integrates/decays light over ~80ms.
class EyePerceptionSimulator {
  constructor() {
    this.perceivedVisual = 0.0;
    this.tauEye = 0.08;
  }
  updateFrame(currentPhysicsMagnitude, deltaTimeSeconds) {
    const physicalLuminance = Math.pow(10, -0.4 * currentPhysicsMagnitude);
    const decayFactor = Math.exp(-deltaTimeSeconds / this.tauEye);
    this.perceivedVisual = (this.perceivedVisual * decayFactor) +
                           (physicalLuminance * (1.0 - decayFactor));
    return this.perceivedVisual;
  }
  reset() { this.perceivedVisual = 0.0; }
}
const eyeSim = new EyePerceptionSimulator();
// Convert eye-integrated luminance to a 0..1 visibility scalar for rendering.
// IMPORTANT: this must be magnitude-based (logarithmic), not a linear ratio
// against the scenario's single instantaneous peak luminance. A linear ratio
// against peakLum makes anything even slightly past the exact T=0 peak read
// as "barely visible" even when it's still thousands of times brighter than
// the naked-eye limit (e.g. mag -7.5 read as 1.5% visibility instead of
// being an obviously bright flash) — that was the actual rendering bug.
// Fixed magnitude range chosen so it visibly saturates well before the
// flash fades to the naked-eye limit, giving a clean bright-to-dim taper.
function luminanceToVisual(lum) {
  const perceivedMag = (lum > 1e-12) ? -2.5 * Math.log10(lum) : (NAKED_EYE_LIMIT + 10);
  const VISUAL_SATURATION_MAG = NAKED_EYE_LIMIT - 8; // fully "1.0" bright by this magnitude or brighter
  const range = NAKED_EYE_LIMIT - VISUAL_SATURATION_MAG;
  const visibility = (NAKED_EYE_LIMIT - perceivedMag) / range;
  return Math.max(0, Math.min(1.5, visibility));
}

}

  return Math.max(0, Math.min(1, 0.5 + delta / 2.0));
}

      { name: "Eltanin", u: 0.0045, v: -0.1296, mag: 2.24 }
    ],
    lines: []
  }
];

function magToConstStarSize(mag) { return Math.max(1.0, 3.6 - mag * 0.65); }
function magToConstStarAlpha(mag) { return Math.max(0.4, 1.0 - mag * 0.12); }

function drawConstellations(flashMag) {
  const scale = Math.min(W, H) * 0.85;
  for (const c of constellations) {
    const lineVis = starVisibility(3.0, flashMag); // lines fade like a mag-3 object
    ctx.strokeStyle = `rgba(120,150,190,${0.35 * lineVis})`;
    ctx.lineWidth = 1;
    for (const [a,b] of c.lines) {
      const sa = c.stars[a], sb = c.stars[b];
      ctx.beginPath();
      ctx.moveTo(cx + sa.u*scale, cy + sa.v*scale);
      ctx.lineTo(cx + sb.u*scale, cy + sb.v*scale);
      ctx.stroke();
    }
    for (const s of c.stars) {
      const vis = starVisibility(s.mag, flashMag);
      if (vis <= 0.001) continue;
      const x = cx + s.u*scale, y = cy + s.v*scale;
      const r = magToConstStarSize(s.mag);
      const a = magToConstStarAlpha(s.mag) * vis;
      ctx.beginPath();
      ctx.fillStyle = `rgba(255,255,255,${a})`;
      ctx.arc(x, y, r, 0, Math.PI*2);
      ctx.fill();
    }
    const labelStar = c.stars[0];
    const lx = cx + labelStar.u*scale;
    const ly = cy + labelStar.v*scale - 14;
    const labelVis = starVisibility(labelStar.mag, flashMag);
    ctx.font = "11px 'Courier New', monospace";
    ctx.fillStyle = `rgba(140,170,205,${0.75 * labelVis})`;
    ctx.textAlign = "center";
    ctx.fillText(c.name, lx, ly);
  }
}

// ===== Horizon / ground silhouette =====
let horizonPoints = [];
function buildHorizon() {
  if (!W) return;
  horizonPoints = [];
  const groundY = H * 0.82;
  const segments = 60;
  let seed2 = 777;
  function r2() {
    seed2 = (seed2 * 1103515245 + 12345) & 0x7fffffff;
    return (seed2 % 10000) / 10000;
  }
  for (let i = 0; i <= segments; i++) {
    const x = (W / segments) * i;
    const roll = Math.sin(i * 0.4) * 4 + Math.sin(i * 1.3) * 2;
    const bump = (r2() < 0.08) ? r2() * 14 : 0;
    horizonPoints.push({ x, y: groundY - roll - bump });
  }
}

function drawGround(visibility) {
  const groundBaseY = H * 0.82;
  const groundLight = visibility * 0.5;

  ctx.beginPath();
  ctx.moveTo(0, H);
  ctx.lineTo(horizonPoints[0].x, horizonPoints[0].y);
  for (const p of horizonPoints) ctx.lineTo(p.x, p.y);
  ctx.lineTo(W, H);
  ctx.closePath();

  const groundGrad = ctx.createLinearGradient(0, groundBaseY - 20, 0, H);
  groundGrad.addColorStop(0, `rgba(${40+groundLight*180},${38+groundLight*160},${34+groundLight*130},1)`);
  groundGrad.addColorStop(1, `rgba(${8+groundLight*40},${8+groundLight*35},${8+groundLight*30},1)`);
  ctx.fillStyle = groundGrad;
  ctx.fill();

  if (visibility > 0.05) {
    ctx.beginPath();
    ctx.moveTo(horizonPoints[0].x, horizonPoints[0].y);
    for (const p of horizonPoints) ctx.lineTo(p.x, p.y);
    ctx.strokeStyle = `rgba(255,230,190,${visibility*0.6})`;
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
}

// ===== Flash rendering =====
function drawFlash(visibility, mag) {
  if (visibility <= 0.001) return;
  const maxGlowRadius = Math.min(W, H) * 0.9;
  const coreRadius = 3 + visibility * 14;
  const glowRadius = 20 + visibility * visibility * maxGlowRadius;

  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowRadius);
  grad.addColorStop(0, `rgba(255,255,255,${0.95*visibility})`);
  grad.addColorStop(0.05, `rgba(255,250,235,${0.85*visibility})`);
  grad.addColorStop(0.25, `rgba(255,230,180,${0.35*visibility})`);
  grad.addColorStop(0.6, `rgba(255,210,150,${0.10*visibility})`);
  grad.addColorStop(1, `rgba(255,200,140,0)`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  ctx.beginPath();
  ctx.fillStyle = `rgba(255,255,255,${Math.min(1, visibility*1.3)})`;
  ctx.arc(cx, cy, coreRadius, 0, Math.PI*2);
  ctx.fill();
}

// ===== Brightness curve graph (luminance / magnitude, with live position dot) =====
let graphMode = 'lum'; // 'lum' | 'mag'
let graphCurve = []; // [{t, mag, lum}], t is seconds since detonation (0 = flash start)
const graphCanvas = document.getElementById('graphCanvas');
const graphCtx = graphCanvas.getContext('2d');

function buildGraphCurve() {
  graphCurve = [];
  const samples = 160;
  const postDetSpan = TOTAL_DURATION - PRE_DELAY; // seconds from flash start to end of animation
  for (let i = 0; i <= samples; i++) {
    const tSinceDet = (postDetSpan * i) / samples;
    const mag = magnitudeAtTime(tSinceDet + PRE_DELAY);
    const lum = Math.pow(10, -0.4 * mag);
    graphCurve.push({ t: tSinceDet, mag, lum });
  }
}

function drawGraph() {
  const w = graphCanvas.width, h = graphCanvas.height;
  graphCtx.clearRect(0, 0, w, h);
  if (graphCurve.length < 2) return;

  const padL = 34, padR = 6, padT = 6, padB = 16;
  const plotW = w - padL - padR, plotH = h - padT - padB;

  const tMax = graphCurve[graphCurve.length - 1].t || 1;

  let yMin, yMax, valueOf;
  if (graphMode === 'lum') {
    // Linear scale: luminance genuinely spans orders of magnitude, so a
    // linear y-axis shows the true spike-and-decay shape (mostly near zero
    // with a sharp peak), which is the physically honest picture.
    valueOf = (p) => p.lum;
    yMin = 0;
    yMax = Math.max(...graphCurve.map(p => p.lum)) * 1.05 || 1;
  } else {
    // Magnitude is already a logarithmic quantity by definition, so its
    // y-axis stays linear-in-magnitude-units (that's the normal, correct
    // way to plot magnitude — do not re-log it).
    valueOf = (p) => p.mag;
    const magVals = graphCurve.map(p => p.mag);
    yMin = Math.min(...magVals) - 1;
    yMax = Math.max(NAKED_EYE_LIMIT + 1, Math.max(...magVals) + 1);
  }

  function xOf(t) { return padL + (t / tMax) * plotW; }
  function yOf(v) {
    // For magnitude, smaller/negative = brighter = should plot HIGHER on screen.
    if (graphMode === 'mag') {
      return padT + ((v - yMin) / (yMax - yMin)) * plotH;
    }
    // For luminance, larger = brighter = higher on screen (standard orientation).
    return padT + plotH - ((v - yMin) / (yMax - yMin)) * plotH;
  }

  // Axis lines
  graphCtx.strokeStyle = 'rgba(80,110,145,0.35)';
  graphCtx.lineWidth = 1;
  graphCtx.beginPath();
  graphCtx.moveTo(padL, padT); graphCtx.lineTo(padL, padT+plotH); graphCtx.lineTo(padL+plotW, padT+plotH);
  graphCtx.stroke();

  // Naked-eye-limit reference line (mag 6) for magnitude mode
  if (graphMode === 'mag') {
    const yLimit = padT + ((NAKED_EYE_LIMIT - yMin) / (yMax - yMin)) * plotH;
    graphCtx.strokeStyle = 'rgba(224,163,92,0.45)';
    graphCtx.setLineDash([3,3]);
    graphCtx.beginPath();
    graphCtx.moveTo(padL, yLimit); graphCtx.lineTo(padL+plotW, yLimit);
    graphCtx.stroke();
    graphCtx.setLineDash([]);
  }

  // Curve
  graphCtx.strokeStyle = '#7fd0ff';
  graphCtx.lineWidth = 1.4;
  graphCtx.beginPath();
  graphCurve.forEach((p, i) => {
    const x = xOf(p.t), y = yOf(valueOf(p));
    if (i === 0) graphCtx.moveTo(x, y); else graphCtx.lineTo(x, y);
  });
  graphCtx.stroke();

  // Y axis labels (min/max)
  graphCtx.fillStyle = '#56728f';
  graphCtx.font = '8px monospace';
  graphCtx.textAlign = 'right';
  const fmtY = (v) => graphMode === 'lum' ? v.toExponential(1) : v.toFixed(1);
  graphCtx.fillText(fmtY(yMax), padL - 3, padT + 7);
  graphCtx.fillText(fmtY(yMin), padL - 3, padT + plotH);
  graphCtx.textAlign = 'left';
  graphCtx.fillText('0s', padL, padT + plotH + 12);
  graphCtx.textAlign = 'right';
  graphCtx.fillText(tMax.toFixed(1)+'s', padL+plotW, padT + plotH + 12);

  // Live position dot, only meaningful once flash has started and animation hasn't exceeded curve range
  if (currentGraphTSinceDet !== null) {
    const tClamped = Math.max(0, Math.min(tMax, currentGraphTSinceDet));
    const magNow = magnitudeAtTime(tClamped + PRE_DELAY);
    const lumNow = Math.pow(10, -0.4 * magNow);
    const dotVal = graphMode === 'lum' ? lumNow : magNow;
    const dx = xOf(tClamped), dy = yOf(dotVal);
    graphCtx.beginPath();
    graphCtx.fillStyle = '#ffe08a';
    graphCtx.arc(dx, dy, 3, 0, Math.PI*2);
    graphCtx.fill();
  }

  document.getElementById('graphAxisNote').textContent =
    graphMode === 'lum' ? 'Y: relative luminance (linear)' : 'Y: apparent magnitude (— dashed = naked-eye limit)';
}

let currentGraphTSinceDet = null; // seconds since detonation for the live dot, null = hide dot

document.getElementById('graphModeLum').addEventListener('click', () => {
  graphMode = 'lum';
  document.getElementById('graphModeLum').classList.add('active');
  document.getElementById('graphModeMag').classList.remove('active');
  drawGraph();
});
document.getElementById('graphModeMag').addEventListener('click', () => {
  graphMode = 'mag';
  document.getElementById('graphModeMag').classList.add('active');
  document.getElementById('graphModeLum').classList.remove('active');
  drawGraph();
});

// ===== Animation loop with play/pause/restart control =====
// playState: 'stopped' | 'playing' | 'paused'
let playState = 'stopped';
let elapsedAtPause = 0;   // seconds of sim-time banked from previous play segments
let segmentStartTime = null; // performance.now() timestamp when current play segment began
let rafHandle = null;

function currentSimTime(now) {
  if (playState === 'playing') {
    return elapsedAtPause + (now - segmentStartTime) / 1000;
  }
  return elapsedAtPause;
}

let lastFrameWallTime = null; // performance.now() of the previous rendered frame, for real eye-sim delta time

function renderAtTime(t, dtOverride) {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  const mag = magnitudeAtTime(t);

  // Feed the raw physics magnitude through the eye-persistence filter using
  // real elapsed wall-clock time between frames, so brief flashes get
  // properly smeared/integrated the way a human eye actually perceives them.
  let dt = dtOverride;
  if (dt === undefined) {
    const nowMs = performance.now();
    dt = (lastFrameWallTime === null) ? (1/60) : Math.max(0, (nowMs - lastFrameWallTime) / 1000);
    lastFrameWallTime = nowMs;
  }
  const perceivedLum = eyeSim.updateFrame(mag, dt);
  const visibility = luminanceToVisual(perceivedLum);
  // Invert luminance -> magnitude so star washout/reappearance is driven by
  // what the eye actually perceives (persistence-smoothed), not the raw
  // instantaneous physics curve. Without this, stars snap back to visible
  // far faster than the flash glow itself fades, since the fast 300ms decay
  // outruns the eye's ~80ms integration on the way down.
  const perceivedMag = (perceivedLum > 1e-12)
    ? -2.5 * Math.log10(perceivedLum)
    : (NAKED_EYE_LIMIT + 10);

  const scale = Math.min(W, H) * 0.85;
  for (const s of STARS) {
    const vis = starVisibility(s.m, perceivedMag);
    if (vis <= 0.001) continue;
    const x = cx + s.u*scale, y = cy + s.v*scale;
    if (y > H * 0.82) continue;
    ctx.beginPath();
    ctx.fillStyle = `rgba(255,255,255,${magToStarAlpha(s.m) * vis})`;
    ctx.arc(x, y, magToStarSize(s.m), 0, Math.PI*2);
    ctx.fill();
  }

  drawConstellations(perceivedMag);
  drawFlash(visibility, mag);
  drawGround(visibility);

  const tSinceDet = t - PRE_DELAY;
  document.getElementById('tReadout').textContent =
    (tSinceDet < 0 ? '-' + Math.abs(tSinceDet).toFixed(2) : '+' + tSinceDet.toFixed(2));
  document.getElementById('magReadout').textContent =
    (t <= PRE_DELAY || perceivedMag > NAKED_EYE_LIMIT) ? '—' : perceivedMag.toFixed(2);

  // Update the graph's live position dot. Before detonation, hide the dot
  // (null) rather than plotting a meaningless pre-flash point.
  currentGraphTSinceDet = (tSinceDet < 0) ? null : tSinceDet;
  drawGraph();
}

function frame(now) {
  if (playState !== 'playing') return;
  const t = currentSimTime(now);
  renderAtTime(t);

  if (t >= TOTAL_DURATION) {
    elapsedAtPause = TOTAL_DURATION;
    playState = 'stopped';
    updatePlaybackButtons();
    renderAtTime(TOTAL_DURATION);
    return;
  }
  rafHandle = requestAnimationFrame(frame);
}

function updatePlaybackButtons() {
  const playBtn = document.getElementById('playBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const statusEl = document.getElementById('statusReadout');
  if (playState === 'playing') {
    playBtn.disabled = true; pauseBtn.disabled = false;
    statusEl.textContent = 'Playing';
  } else if (playState === 'paused') {
    playBtn.disabled = false; pauseBtn.disabled = true;
    statusEl.textContent = 'Paused';
  } else {
    playBtn.disabled = false; pauseBtn.disabled = true;
    statusEl.textContent = 'Stopped';
  }
}

function playSim() {
  if (playState === 'playing') return;
  if (elapsedAtPause >= TOTAL_DURATION) {
    elapsedAtPause = 0; // finished -> restart on play
    eyeSim.reset();
    lastFrameWallTime = null;
  }
  playState = 'playing';
  segmentStartTime = performance.now();
  updatePlaybackButtons();
  rafHandle = requestAnimationFrame(frame);
}

function pauseSim() {
  if (playState !== 'playing') return;
  elapsedAtPause = currentSimTime(performance.now());
  playState = 'paused';
  if (rafHandle) cancelAnimationFrame(rafHandle);
  updatePlaybackButtons();
  lastFrameWallTime = null; // next resume/redraw should not use a stale gap as its delta time
  renderAtTime(elapsedAtPause, 0); // redraw current frame without advancing eye-sim state
}

function restartSim() {
  elapsedAtPause = 0;
  eyeSim.reset();
  lastFrameWallTime = null;
  if (playState === 'playing') {
    segmentStartTime = performance.now();
  } else {
    playState = 'stopped';
    renderAtTime(0, 0);
  }
  updatePlaybackButtons();
}

function resetSimForNewScenario() {
  // Called when parameters change (DETONATE / loading a scenario): reset to
  // t=0 and immediately start playing. The left-side PLAY button is only
  // needed afterward to resume from a PAUSE — it does not need to be
  // pressed to start a freshly-detonated scenario.
  if (rafHandle) cancelAnimationFrame(rafHandle);
  playState = 'stopped';
  elapsedAtPause = 0;
  eyeSim.reset();
  lastFrameWallTime = null;
  buildGraphCurve();
  updatePlaybackButtons();
  renderAtTime(0, 0);
  playSim();
}

function formatDistance(km) {
  return km.toLocaleString(undefined, {maximumFractionDigits: 0}) + 'km';
}
function formatYield(kt) {
  if (kt >= 1000) return (kt/1000).toLocaleString(undefined,{maximumFractionDigits:2}) + 'Mt';
  return kt.toLocaleString(undefined,{maximumFractionDigits:3}) + 'kt';
}

function updateHudEvent() {
  document.getElementById('eventReadout').textContent =
    formatYield(YIELD_KT) + ' @ ' + formatDistance(DISTANCE_KM);
  const warnEl = document.getElementById('visWarn');
  if (PEAK_MAG > NAKED_EYE_LIMIT) {
    warnEl.style.display = 'block';
    warnEl.textContent = 'Peak mag ' + PEAK_MAG.toFixed(2) +
      ' is fainter than +6.0 — NOT visible to the naked eye. Try a larger yield or shorter distance.';
  } else {
    warnEl.style.display = 'none';
  }
}

function runScenarioFromInputs() {
  const yieldInput = document.getElementById('yieldInput');
  const distInput = document.getElementById('distInput');
  const errEl = document.getElementById('panelErr');
  errEl.style.display = 'none';

  let yieldKt = parseFloat(yieldInput.value);
  let distKm = parseFloat(distInput.value);

  if (!isFinite(yieldKt) || yieldKt <= 0) {
    errEl.textContent = 'Enter a positive yield (kt).';
    errEl.style.display = 'block';
    return;
  }
  if (!isFinite(distKm) || distKm <= 0) {
    errEl.textContent = 'Enter a positive distance (km).';
    errEl.style.display = 'block';
    return;
  }
  if (yieldKt > MAX_YIELD_KT) {
    yieldKt = MAX_YIELD_KT;
    yieldInput.value = MAX_YIELD_KT;
    errEl.textContent = 'Yield capped at 100,000 kt (100 Mt) — largest weapon ever designed.';
    errEl.style.display = 'block';
  }

  applyScenario(yieldKt, distKm);
  updateHudEvent();
  resetSimForNewScenario();
}

// ===== Scenario JSON loading =====
// Each scenario JSON: { "name": "...", "description": "...", "distance_km": N, "yield_kt": N }
// Description is truncated to 250 chars regardless of file content.
const DESC_MAX_CHARS = 250;
const MANIFEST_URL = 'scenarios/index.json';
let loadedScenarios = []; // {name, description, distance_km, yield_kt}

function truncateDesc(s) {
  if (typeof s !== 'string') return '';
  return s.length > DESC_MAX_CHARS ? s.slice(0, DESC_MAX_CHARS) : s;
}

function validateScenario(obj) {
  if (!obj || typeof obj !== 'object') return null;
  const name = typeof obj.name === 'string' && obj.name.trim() ? obj.name.trim() : 'Unnamed scenario';
  const description = truncateDesc(obj.description || obj.details || '');
  const distance_km = parseFloat(obj.distance_km ?? obj.distanceKm ?? obj.distance);
  const yield_kt = parseFloat(obj.yield_kt ?? obj.yieldKt ?? obj.yield);
  if (!isFinite(distance_km) || distance_km <= 0) return null;
  if (!isFinite(yield_kt) || yield_kt <= 0) return null;
  return { name, description, distance_km, yield_kt: Math.min(yield_kt, MAX_YIELD_KT) };
}

function addScenarioOption(scenario) {
  loadedScenarios.push(scenario);
  const idx = loadedScenarios.length - 1;
  const opt = document.createElement('option');
  opt.value = String(idx);
  opt.textContent = scenario.name;
  document.getElementById('scenarioSelect').appendChild(opt);
  return idx;
}

async function loadManifest() {
  try {
    const res = await fetch(MANIFEST_URL, { cache: 'no-cache' });
    if (!res.ok) return; // no manifest present — fine, custom-only mode
    const manifest = await res.json();
    if (!Array.isArray(manifest)) return;
    for (const entry of manifest) {
      // entry can be a filename string ("scenarios/foo.json") or an inline object
      if (typeof entry === 'string') {
        try {
          const fRes = await fetch(entry, { cache: 'no-cache' });
          if (!fRes.ok) continue;
          const data = await fRes.json();
          const scenario = validateScenario(data);
          if (scenario) addScenarioOption(scenario);
        } catch (e) { /* skip bad file */ }
      } else {
        const scenario = validateScenario(entry);
        if (scenario) addScenarioOption(scenario);
      }
    }
  } catch (e) {
    // No manifest / not hosted with one — silently fall back to custom-only mode.
  }
}

function applySelectedScenario(idx) {
  const scenario = loadedScenarios[idx];
  if (!scenario) return;
  document.getElementById('yieldInput').value = scenario.yield_kt;
  document.getElementById('distInput').value = scenario.distance_km;
  const descEl = document.getElementById('scenarioDesc');
  if (scenario.description) {
    descEl.textContent = scenario.description;
    descEl.style.display = 'block';
  } else {
    descEl.style.display = 'none';
  }
  applyScenario(scenario.yield_kt, scenario.distance_km);
  updateHudEvent();
  resetSimForNewScenario();
}

document.getElementById('scenarioSelect').addEventListener('change', (e) => {
  const val = e.target.value;
  const descEl = document.getElementById('scenarioDesc');
  if (val === '') {
    descEl.style.display = 'none';
    return;
  }
  applySelectedScenario(parseInt(val, 10));
});

document.getElementById('scenarioFileBtn').addEventListener('click', () => {
  document.getElementById('scenarioFileInput').click();
});
document.getElementById('scenarioFileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      const scenario = validateScenario(data);
      if (!scenario) {
        alert('Invalid scenario JSON. Required fields: name, distance_km, yield_kt (description optional, max 250 chars).');
        return;
      }
      const idx = addScenarioOption(scenario);
      document.getElementById('scenarioSelect').value = String(idx);
      applySelectedScenario(idx);
    } catch (err) {
      alert('Could not parse JSON file: ' + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = ''; // allow re-loading the same filename later
});

document.getElementById('playBtn').addEventListener('click', playSim);
document.getElementById('pauseBtn').addEventListener('click', pauseSim);
document.getElementById('restartBtn').addEventListener('click', restartSim);

document.getElementById('runBtn').addEventListener('click', () => {
  document.getElementById('scenarioSelect').value = '';
  document.getElementById('scenarioDesc').style.display = 'none';
  runScenarioFromInputs();
});
document.getElementById('yieldInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('runBtn').click(); });
document.getElementById('distInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('runBtn').click(); });

resize();
applyScenario(YIELD_KT, DISTANCE_KM);
buildGraphCurve();
updateHudEvent();
updatePlaybackButtons();
renderAtTime(0); // draw initial frame but do NOT autoplay
loadManifest();

</script>
</body>
